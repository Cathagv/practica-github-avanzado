name: CI - Develop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Añadir línea de feature al README
        run: |
          RAMA="${{ github.head_ref || github.ref_name }}"
          echo "" >> README.md
          echo "Añadida feature: $RAMA" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: añadir feature $RAMA al README" || exit 0
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN contra LOCAL_DEV_TOKEN
        shell: powershell
        env:
          SECRET_DEV: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:SECRET_DEV -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "Token DEV validado correctamente"
          } else {
            Write-Error "Error: DEV_TOKEN no coincide con LOCAL_DEV_TOKEN"
            exit 1
          }
