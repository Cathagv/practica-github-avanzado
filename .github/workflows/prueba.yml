name: Prueba Self-Hosted Runner

on: [push]

jobs:
  validar-token:
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN contra LOCAL_DEV_TOKEN
        shell: powershell
        env:
          SECRET_DEV: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:SECRET_DEV -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: Los tokens coinciden"
          } else {
            Write-Error "ERROR: Los tokens NO coinciden"
            exit 1
          }
